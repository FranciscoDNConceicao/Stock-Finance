server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: as rotas do react-router caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ficheiros com hash no nome podem ficar muito tempo em cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
