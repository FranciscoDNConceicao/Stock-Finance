version: '3'

services:
  frontend:
    build: ./Frontend/
    ports:
      - "5173:5173"
    depends_on:
      - backend
  backend:
    build: ./Backend/
    env_file:
      - ./Backend/app/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-stockfinance_db}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD no ficheiro .env na raiz}
    ports:
      - "5432:5432"
    volumes:
      - ./backups:/home/backups
