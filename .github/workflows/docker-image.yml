name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend/finance-app-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/finance-app-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    # Os valores sensíveis vêm de GitHub Secrets (Settings > Secrets and variables > Actions)
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      API_NINJA_KEY: ${{ secrets.API_NINJA_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      DOMAIN: localhost
      ENVIRONMENT: local
      DATABASE_NAME: stockfinance_db
      DATABASE_IP: localhost
      DATABASE_USER: admin
      DATABASE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_PORT: "5432"
      originCORS: '["http://localhost:5173"]'

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_DB: stockfinance_db
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d stockfinance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t stock-finance-backend ./Backend

      - name: Build frontend image
        run: docker build -t stock-finance-frontend ./Frontend
