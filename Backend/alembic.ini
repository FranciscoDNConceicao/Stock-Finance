# Database migrations. Run from Backend/:
#   alembic upgrade head                              apply every pending migration
#   alembic revision --autogenerate -m "add x"        new migration from the model changes
# The connection settings come from app.settings (Backend/app/.env or the environment).

[alembic]
script_location = %(here)s/migrations
# So "import app" works when alembic runs from Backend/
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
# Format generated migrations with ruff
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
