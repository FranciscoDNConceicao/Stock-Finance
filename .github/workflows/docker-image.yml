name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    # Os valores sensíveis vêm de GitHub Secrets (Settings > Secrets and variables > Actions)
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      API_NINJA_KEY: ${{ secrets.API_NINJA_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      DOMAIN: localhost
      ENVIRONMENT: local
      DATABASE_NAME: stockfinance_db
      DATABASE_IP: localhost
      DATABASE_USER: admin
      DATABASE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_PORT: "5432"
      originCORS: '["http://localhost:5173"]'

    services:
      db:
        image: postgres
        env:
          POSTGRES_USER: admin
          POSTGRES_DB: stockfinance_db
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - "5432:5432"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'
      - name: Install frontend dependencies
        working-directory: ./Frontend
        run: npm install
      - name: Build frontend
        working-directory: ./Frontend
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install backend dependencies
        working-directory: ./Backend
        run: |
          python -m venv env
          source env/bin/activate
          pip install -r requirements.txt
      - name: Run backend tests
        working-directory: ./Backend
        run: |
          source env/bin/activate
          pytest
